[project]
name = "filelens-mcp"
version = "0.1.0"
description = "FileLens: a read-only, sandboxed file reader for AI assistants. Type-aware extraction and citable references over MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "pypdf>=5",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "reportlab>=4"]

[project.scripts]
filelens = "filelens.__main__:main"
filelens-chat = "filelens.playground:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filelens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 125
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long prose in tool descriptions and messages is intentional
